<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম | আমার ওয়েবসাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 12px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>আমার নতুন ওয়েবসাইটে স্বাগতম!</h1>
        <p>GitHub Pages-এর সাহায্যে সফলভাবে এই ওয়েবসাইটটি তৈরি করা হয়েছে। পরবর্তীতে এখানে আরও নতুন তথ্য এবং কনটেন্ট যুক্ত করা হবে।</p>
        <a href="https://github.com/shipramandal0009" class="btn">GitHub પ્રોફાઇલ</a>
    </div>
</body>
</html>
